[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-iml"
version = "0.1.0"
description = "Official LangChain/LangGraph integration SDK for IML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.10",
    "pydantic>=2.0.0"
]
