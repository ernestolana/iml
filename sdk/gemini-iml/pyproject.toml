[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-iml"
version = "0.1.0"
description = "Official Google GenAI Python SDK integration for IML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.0.0"
]
